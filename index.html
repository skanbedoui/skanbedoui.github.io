<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skander Bedoui</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Skander Bedoui : étudiant en génie logiciel, applications full-stack et outils d'IA concrets. Disponible pour un stage PFE de six mois, de janvier à juin 2027.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single scroll. Split hero (name + live log console), filterable project index,
   timeline, skills, about, contact. Cool paper + ink with one indigo accent.
   Readability first: 18px base text, high-contrast secondary text, 48px controls,
   plain-language labels, and a pause button for the only moving element.
   Four languages (fr default, en, ar right-to-left, es); layout uses logical properties. */
:root {
  --paper: #eef0f3;
  --surface: #ffffff;
  --sunk: #e4e7ec;
  --ink: #12141c;
  --muted: #3d4354;
  --line: #c5cad4;
  --accent: #3a29c9;
  --accent-soft: #e6e3ff;
  --console: #161925;
  --console-ink: #e3e6f2;
  --console-dim: #9aa0b8;
  --lv-info: #5cc49b;
  --lv-warn: #f0b54a;
  --lv-err: #ff8a69;
  --lv-debug: #a9a2ff;

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --track-tight: -0.03em;

  --step--1: 0.9375rem;
  --step-0: 1.125rem;
  --step-1: 1.3125rem;
  --step-2: 1.625rem;
  --step-3: clamp(2rem, 1.5rem + 2vw, 2.75rem);
  --step-5: clamp(3rem, 1.6rem + 6.4vw, 6.25rem);

  --wrap: 1180px;
  --radius: 12px;
}
:root[lang="ar"] {
  --f-display: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --track-tight: 0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1016; --surface: #171a23; --sunk: #222738; --ink: #f1f2f6; --muted: #c3c8d6;
    --line: #363c4e; --accent: #a59dff; --accent-soft: #28244f;
    --console: #0a0c12; --console-ink: #e3e6f2; --console-dim: #9aa0b8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1016; --surface: #171a23; --sunk: #222738; --ink: #f1f2f6; --muted: #c3c8d6;
  --line: #363c4e; --accent: #a59dff; --accent-soft: #28244f;
  --console: #0a0c12; --console-ink: #e3e6f2; --console-dim: #9aa0b8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--step-0);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
:root[lang="ar"] body { line-height: 1.8; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.1; }
:root[lang="ar"] h2, :root[lang="ar"] h3 { line-height: 1.35; }
p { max-width: 68ch; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.skip {
  position: absolute; inset-inline-start: 16px; top: -100px; z-index: 20;
  background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 8px;
  font-weight: 600; text-decoration: none;
}
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + 12px); }

.wrap {
  max-width: var(--wrap);
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 700px) {
  .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
}
.label {
  font-size: var(--step--1);
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent);
}
:root[lang="ar"] .label { letter-spacing: 0; }

/* ---------- header ---------- */
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--paper);
}
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; min-height: 68px; }
.mark {
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
  font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; font-weight: 700; font-size: 1.2rem;
}
.mark b {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px;
  background: var(--ink); color: var(--paper); font-size: 0.9rem;
}
.nav { display: flex; gap: 4px; margin-inline-start: auto; }
.nav a {
  text-decoration: none; color: var(--ink); font-size: 1.05rem; font-weight: 500;
  padding: 10px 12px; border-radius: 8px; min-height: 44px; display: inline-flex; align-items: center;
}
.nav a:hover { background: var(--sunk); text-decoration: underline; text-underline-offset: 4px; }
.tools { display: flex; gap: 8px; align-items: center; }
.theme-btn, .lang-pick {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  height: 44px; border-radius: 8px; font: 500 1rem var(--f-body);
}
.theme-btn { padding: 0 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.theme-btn svg { width: 18px; height: 18px; flex: none; }
.lang-pick { display: inline-flex; align-items: center; gap: 6px; padding-inline: 12px 4px; }
.lang-pick svg { width: 18px; height: 18px; flex: none; color: var(--accent); }
.lang-pick select {
  border: 0; background: transparent; color: var(--ink); font: 600 1rem var(--f-body);
  height: 100%; padding-inline: 2px 8px; cursor: pointer;
}
.lang-pick select:focus-visible { outline: none; }
.lang-pick:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 1140px) {
  .top .wrap { padding-block: 8px; }
  .tools { margin-inline-start: auto; }
  .nav { order: 3; width: 100%; margin-inline: -12px; overflow-x: auto; }
  .nav a { white-space: nowrap; }
}
@media (max-width: 480px) {
  .mark span { display: none; }
  .theme-btn .theme-text { display: none; }
}

/* ---------- hero ---------- */
.hero { padding-block: clamp(48px, 8vw, 96px) clamp(40px, 6vw, 72px); }
.hero .wrap { display: grid; grid-template-columns: 1.08fr 0.92fr; gap: clamp(32px, 5vw, 64px); align-items: center; }
@media (max-width: 920px) { .hero .wrap { grid-template-columns: 1fr; } }
.hero-copy { min-width: 0; }
.avail {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 16px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
  font-size: 1rem; font-weight: 600;
}
.avail i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
.hero h1 {
  font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  font-size: var(--step-5); font-weight: 800; letter-spacing: -0.03em;
  margin-top: 22px;
}
.hero h1 span { display: block; color: var(--accent); }
.lede { font-size: var(--step-1); color: var(--muted); max-width: 36ch; margin: 22px 0 0; line-height: 1.55; }
.lede strong { color: var(--ink); font-weight: 600; }
.ctas { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; }
.btn {
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
  min-height: 52px; padding: 12px 24px; border-radius: 10px; font: 600 1.075rem var(--f-body);
  border: 2px solid var(--ink); cursor: pointer; transition: background .15s ease;
}
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--sunk); }
.btn.primary:hover { text-decoration: underline; text-underline-offset: 4px; }
.btn svg { width: 18px; height: 18px; flex: none; }
:root[dir="rtl"] .btn svg.ext, :root[dir="rtl"] .card-link svg { transform: scaleX(-1); }
.cv-alt { margin: 14px 0 0; font-size: 1.05rem; }
.cv-alt a { display: inline-block; padding: 8px 0; color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 30px; color: var(--muted); font-size: 1.05rem; }

/* console */
.console {
  min-width: 0; margin: 0;
  background: var(--console); color: var(--console-ink);
  border-radius: 14px; overflow: hidden;
  box-shadow: 0 30px 60px -30px rgba(10, 12, 30, .55);
}
.console-bar {
  display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-inline: 16px 12px;
  border-bottom: 1px solid rgba(255,255,255,.1); color: var(--console-dim); font: 13px var(--f-mono);
}
.console-bar .dots { display: flex; gap: 6px; }
.console-bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.2); }
.pause {
  margin-inline-start: auto; display: inline-flex; align-items: center; gap: 8px;
  min-height: 40px; padding: 0 14px; border-radius: 8px; cursor: pointer;
  background: rgba(255,255,255,.08); color: var(--console-ink); border: 1px solid rgba(255,255,255,.18);
  font: 500 14px var(--f-body);
}
.pause:hover { background: rgba(255,255,255,.14); }
.pause svg { width: 14px; height: 14px; }
.stream {
  height: 336px; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px;
  font-family: var(--f-mono); font-size: 14px; line-height: 1.75; text-align: left;
  mask-image: linear-gradient(to bottom, transparent 0, #000 18%); -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18%);
}
.ln { display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: baseline; white-space: nowrap; animation: lnIn .4s ease both; }
@keyframes lnIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.ln.still { animation: none; }
@media (prefers-reduced-motion: reduce) { .ln { animation: none; } }
.ln .t { color: var(--console-dim); }
.ln .lv { font-weight: 500; width: 5ch; }
.lv.INFO { color: var(--lv-info); } .lv.WARN { color: var(--lv-warn); } .lv.ERROR { color: var(--lv-err); } .lv.DEBUG { color: var(--lv-debug); }
.ln .msg { overflow: hidden; text-overflow: ellipsis; }
.ln .msg em { font-style: normal; color: #fff; }
.ln .crit { font-size: 12px; padding: 0 7px; border-radius: 4px; background: rgba(255,255,255,.1); color: var(--console-ink); }
.ln .crit.hi { background: rgba(240,181,74,.22); color: var(--lv-warn); }
.console-foot { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.1); color: var(--console-ink); font: 15px/1.6 var(--f-body); }
@media (max-width: 520px) { .ln .t { display: none; } .ln { grid-template-columns: auto 1fr auto; } .stream { height: 300px; font-size: 13px; } }

/* ---------- sections ---------- */
section.block { padding-block: clamp(56px, 8vw, 104px); border-top: 1px solid var(--line); }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px 40px; margin-bottom: 36px; }
.sec-head h2 { font-size: var(--step-3); font-weight: 700; letter-spacing: calc(var(--track-tight) * .6); margin-top: 10px; }
.sec-head p { max-width: 46ch; color: var(--muted); margin: 0; }

/* filters */
.filters-label { font-weight: 600; margin: 0 0 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 32px; }
.chip {
  font: 600 1.025rem var(--f-body); min-height: 48px; padding: 10px 20px; border-radius: 999px; cursor: pointer;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
}
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .n { font-weight: 500; opacity: .8; margin-inline-start: 6px; }

/* projects */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
@media (max-width: 440px) { .grid { grid-template-columns: 1fr; } }
.card {
  min-width: 0; display: flex; flex-direction: column; gap: 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 26px;
}
.card.feature { grid-column: span 2; }
@media (max-width: 800px) { .card.feature { grid-column: auto; } }
.origin { font-size: 0.95rem; font-weight: 600; color: var(--accent); }
.card h3 { font-size: var(--step-2); font-weight: 700; letter-spacing: calc(var(--track-tight) * .4); margin-top: -8px; }
.card p { margin: 0; color: var(--ink); }
.facts-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.facts-list li { background: var(--sunk); border-radius: 8px; padding: 6px 12px; font-size: 0.98rem; font-weight: 500; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.tags-label { font-size: 0.95rem; color: var(--muted); margin: 0 0 -6px; }
.tags span { font-size: 0.95rem; padding: 4px 11px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink); direction: ltr; }
.card-link {
  display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
  min-height: 48px; padding: 10px 18px; border-radius: 10px;
  border: 2px solid var(--accent); color: var(--accent);
  font-weight: 600; font-size: 1.025rem; text-decoration: none;
}
.card-link:hover { background: var(--accent-soft); text-decoration: underline; text-underline-offset: 4px; }
.card-link svg { width: 17px; height: 17px; flex: none; }
.card-link.off { border: 0; padding-inline-start: 0; color: var(--muted); font-weight: 500; }
.bars { display: grid; gap: 9px; }
.bar-title { font-weight: 600; margin-bottom: 10px; font-size: 1rem; }
.bar { display: grid; grid-template-columns: minmax(9ch, auto) 1fr 4.5ch; gap: 12px; align-items: center; font-size: 0.98rem; }
.bar .track { height: 12px; background: var(--sunk); border-radius: 6px; overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.bar .v { text-align: end; font-weight: 600; font-variant-numeric: tabular-nums; }

/* experience */
.tl {
  display: grid; grid-template-columns: 210px 1fr; gap: 12px 40px;
  padding-block: 30px; border-top: 1px solid var(--line);
}
.tl:last-child { border-bottom: 1px solid var(--line); }
@media (max-width: 700px) { .tl { grid-template-columns: 1fr; } }
.tl .when { font-size: 1.15rem; font-weight: 700; color: var(--accent); }
.tl .when small { display: block; color: var(--muted); font-size: 1rem; font-weight: 500; }
.tl h3 { font-size: var(--step-1); font-weight: 700; }
.tl h3 span { display: block; color: var(--muted); font-family: var(--f-body); font-weight: 500; font-size: 1.1rem; margin-top: 4px; }
.tl ul { margin: 12px 0 0; padding-inline-start: 1.2em; max-width: 68ch; }
.tl li + li { margin-top: 6px; }
.tl .tags { margin-top: 14px; }

/* skills */
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.skill { background: var(--surface); padding: 24px; min-width: 0; }
.skill h3 { font-family: var(--f-body); font-weight: 700; font-size: 1.1rem; color: var(--accent); margin-bottom: 12px; }
.skill ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

/* about */
.about { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: clamp(32px, 6vw, 80px); }
@media (max-width: 860px) { .about { grid-template-columns: 1fr; } }
.about .big { font-family: var(--f-display); font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2.1rem); font-weight: 500; line-height: 1.35; letter-spacing: calc(var(--track-tight) * .3); margin: 14px 0 0; max-width: 28ch; }
.about .big em { font-style: normal; color: var(--accent); }
.about .body { margin-top: 22px; }
.facts { display: grid; gap: 24px; align-content: start; }
.fact h3 { font-family: var(--f-body); font-size: 1.15rem; font-weight: 700; }
.fact p { margin: 4px 0 0; color: var(--muted); }

/* contact: fixed dark band in both themes */
.contact { background: #12141c; color: #f1f2f6; border-top: 0; }
.contact .label { color: #b9b3ff; }
.contact h2 { font-size: var(--step-5); font-weight: 800; letter-spacing: var(--track-tight); margin-top: 16px; line-height: 1.1; }
:root[lang="ar"] .contact h2 { font-size: clamp(2.5rem, 1.4rem + 5vw, 5rem); line-height: 1.3; }
.contact h2 span { color: #b9b3ff; }
.contact p { color: #d5d8e3; max-width: 48ch; font-size: var(--step-1); }
.links { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; }
.contact .btn { border-color: #f1f2f6; color: #f1f2f6; background: transparent; }
.contact .btn:hover { background: rgba(255,255,255,.1); }
.contact .btn.primary { background: #f1f2f6; color: #12141c; }
.copy-note { font-size: 1.05rem; margin-top: 16px; min-height: 1.5em; color: #d5d8e3; }
footer { background: #12141c; color: #c3c8d6; font-size: 1rem; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; padding-block: 24px; border-top: 1px solid #2c3142; }
footer a { color: #f1f2f6; }
</style>
</head>
<body>

<a class="skip" href="#work" data-i18n="skip"></a>
<header class="top">
  <div class="wrap">
    <a class="mark" href="#top" aria-label="Skander Bedoui"><b>SB</b><span>Skander Bedoui</span></a>
    <nav class="nav" id="nav">
      <a href="#work" data-i18n="nav.work"></a>
      <a href="#experience" data-i18n="nav.exp"></a>
      <a href="#skills" data-i18n="nav.skills"></a>
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="tools">
      <label class="lang-pick">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.6 4 6 4 9.5s-1.4 6.9-4 9.5c-2.6-2.6-4-6-4-9.5s1.4-6.9 4-9.5z"/></svg>
        <span class="sr" data-i18n="lang"></span>
        <select id="lang-select">
          <option value="fr" lang="fr">Français</option>
          <option value="en" lang="en">English</option>
          <option value="ar" lang="ar">العربية</option>
          <option value="es" lang="es">Español</option>
        </select>
      </label>
      <button class="theme-btn" id="theme-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        <span class="theme-text" id="theme-label"></span>
      </button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div class="hero-copy">
        <span class="avail"><i></i><span data-i18n="hero.avail"></span></span>
        <h1 dir="ltr" style="text-align:start">Skander <span>Bedoui</span></h1>
        <p class="lede" data-i18n="hero.lede"></p>
        <div class="ctas">
          <a class="btn primary" href="#work"><span data-i18n="hero.cta1"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg></a>
          <a class="btn ghost" id="cv-main" href="Skander_Bedoui_CV_FR.pdf?v=2" download><span data-i18n="hero.cta2"></span>

function card(p, t) {
  const d = t.p[p.id];
  const title = d.title || p.title;
  const bars = p.values ? `<div><div class="bar-title">${esc(d.barLabel)}</div><div class="bars">${
    p.values.map((v, k) => `<div class="bar"><span>${esc(d.bars[k])}</span><span class="track"><span class="fill" style="width:${v * 100}%"></span></span><span class="v" dir="ltr">${Math.round(v * 100)}%</span></div>`).join("")
  }</div></div>` : "";
  const facts = d.facts ? `<ul class="facts-list">${d.facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : "";
  const link = p.repo
    ? `<a class="card-link" href="${GH + p.repo}" target="_blank" rel="noopener">${esc(t["card.code"])} ${ARROW}<span class="sr"> — ${esc(title)} ${esc(t["card.newtab"])}</span></a>`
    : `<span class="card-link off">${esc(t["card.off"])}</span>`;
  return `<article class="card${p.feature ? " feature" : ""}" data-area="${p.area}"${area === "all" || area === p.area ? "" : " hidden"}>
    <div class="origin">${esc(d.origin)}</div>
    <h3>${esc(title)}</h3>
    <p>${esc(d.text)}</p>${facts}${bars}
    <p class="tags-label">${esc(t["card.built"])}</p>
    <div class="tags">${p.tags.map(x => `<span>${esc(x)}</span>`).join("")}</div>
    ${link}
  </article>`;
}

function renderProjects(t) {
  grid.innerHTML = PROJECTS.map(p => card(p, t)).join("");
  filters.innerHTML = AREAS.map(k => {
    const n = k === "all" ? PROJECTS.length : PROJECTS.filter(p => p.area === k).length;
    return `<button type="button" class="chip" id="f-${k}" data-k="${k}" aria-pressed="${k === area}">${esc(t["f." + k])}<span class="n">(${n})</span></button>`;
  }).join("");
}
filters.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  area = b.dataset.k;
  filters.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  grid.querySelectorAll(".card").forEach(c => { c.hidden = !(area === "all" || c.dataset.area === area); });
});

const CV_FILE = { fr: "Skander_Bedoui_CV_FR.pdf?v=2", en: "Skander_Bedoui_CV.pdf?v=2" };
const CV_LANG = { fr: "fr", ar: "fr", en: "en", es: "en" }; /* CV offered first in each site language */

function renderContact(t) {
  let html = "";
  if (CONTACT.email) html += `<button type="button" class="btn primary" id="copy-email">${esc(t["contact.copy"])}</button>`;
  html += `<a class="btn ${CONTACT.email ? "ghost" : "primary"}" href="https://github.com/skanbedoui" target="_blank" rel="noopener">${esc(t["contact.gh"])}</a>`;
  if (CONTACT.linkedin) html += `<a class="btn ghost" href="${esc(CONTACT.linkedin)}" target="_blank" rel="noopener">${esc(t["contact.li"])}</a>`;
  const cvs = CV_LANG[lang] === "fr" ? ["fr", "en"] : ["en", "fr"];
  cvs.forEach(k => { html += `<a class="btn ghost" href="${CV_FILE[k]}" download>${esc(t["contact.cv." + k])}</a>`; });
  links.innerHTML = html;
  note.textContent = CONTACT.email ? t["contact.email"] + CONTACT.email : "";
  const copyBtn = document.getElementById("copy-email");
  if (copyBtn) copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(CONTACT.email)
      .then(() => { note.textContent = T[lang]["contact.copied"] + CONTACT.email; })
      .catch(() => { note.textContent = T[lang]["contact.email"] + CONTACT.email; });
  });
}

function setLang(next, save) {
  lang = LANGS.includes(next) ? next : "fr";
  const t = T[lang];
  root.lang = lang;
  root.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t[el.dataset.i18n]; });
  document.getElementById("nav").setAttribute("aria-label", t["nav.label"]);
  const md = document.querySelector('meta[name="description"]'); if (md) md.content = t["meta.desc"];
  document.getElementById("lang-select").value = lang;
  const first = CV_LANG[lang];
  document.getElementById("cv-main").href = CV_FILE[first];
  document.getElementById("cv-alt").href = CV_FILE[first === "fr" ? "en" : "fr"];
  renderProjects(t);
  renderContact(t);
  syncThemeLabel();
  syncPauseLabel();
  if (save) { try { localStorage.setItem("sb-lang", lang); } catch (e) {} }
}
document.getElementById("lang-select").addEventListener("change", e => setLang(e.target.value, true));

/* theme toggle */
const themeLabel = document.getElementById("theme-label");
const themeBtn = document.getElementById("theme-btn");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
function syncThemeLabel() {
  const txt = T[lang][isDark() ? "theme.toLight" : "theme.toDark"];
  themeLabel.textContent = txt;
  themeBtn.setAttribute("aria-label", txt);
}
try { const th = localStorage.getItem("sb-theme"); if (th) root.dataset.theme = th; } catch (e) {}
themeBtn.addEventListener("click", () => {
  root.dataset.theme = isDark() ? "light" : "dark";
  syncThemeLabel();
  try { localStorage.setItem("sb-theme", root.dataset.theme); } catch (e) {}
});

/* live log console */
const LINES = [
  ["INFO", "profile.load <em>name=\"Skander Bedoui\"</em> school=MedTech", 2],
  ["INFO", "focus.set areas=[<em>full-stack</em>, <em>applied-ai</em>]", 2],
  ["INFO", "ai-logs.parse formats=7 scored=1..10", 3],
  ["INFO", "librarian.eval <em>first_hit=89%</em> questions=167", 3],
  ["DEBUG", "benchmark.clauses large=100% small=10%", 2],
  ["INFO", "internship.done org=Sofia_Technologies", 3],
  ["INFO", "internship.done org=ATB year=2024", 3],
  ["WARN", "availability <em>2027-01..2027-06</em> status=open", 8],
  ["INFO", "downloader.run parts=8 resume=ok", 2],
  ["INFO", "vr-museum.build engine=unity", 2],
  ["INFO", "grader.run examples=112", 3],
  ["WARN", "next_step <em>contact skander</em>", 7],
];
const stream = document.getElementById("stream");
let i = 0, timer = null, clock = new Date(2026, 10, 22, 9, 14, 2);
function stamp() { clock = new Date(clock.getTime() + 900 + Math.random() * 2600); return clock.toTimeString().slice(0, 8); }
function push(still) {
  const [lv, msg, c] = LINES[i % LINES.length]; i++;
  const el = document.createElement("div");
  el.className = still === true ? "ln still" : "ln";
  el.innerHTML = `<span class="t">${stamp()}</span><span class="lv ${lv}">${lv}</span><span class="msg">${msg}</span><span class="crit${c >= 7 ? " hi" : ""}">${c}/10</span>`;
  stream.appendChild(el);
  while (stream.children.length > 16) stream.firstElementChild.remove();
}
for (let k = 0; k < 12; k++) push(true);

const pauseBtn = document.getElementById("pause");
const pauseLabel = document.getElementById("pause-label");
const pauseIcon = document.getElementById("pause-icon");
const ICON_PAUSE = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
const ICON_PLAY = '<path d="M7 5v14l12-7z"/>';
function syncPauseLabel() {
  const run = !!timer;
  pauseBtn.setAttribute("aria-pressed", String(!run));
  pauseLabel.textContent = T[lang][run ? "pause" : "play"];
  pauseIcon.innerHTML = run ? ICON_PAUSE : ICON_PLAY;
}
function setRunning(run) {
  clearInterval(timer); timer = null;
  if (run) timer = setInterval(push, 2600);
  syncPauseLabel();
}
pauseBtn.addEventListener("click", () => setRunning(!timer));

/* start: ?lang=xx in the address wins, then the visitor's last choice, then French */
let start = "fr";
try { const q = new URLSearchParams(location.search).get("lang"); const s = localStorage.getItem("sb-lang"); start = LANGS.includes(q) ? q : (LANGS.includes(s) ? s : "fr"); } catch (e) {}
setLang(start, false);
setRunning(!matchMedia("(prefers-reduced-motion: reduce)").matches);
</script>
